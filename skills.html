<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能 | 何凯作品集</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <header class="nav-bar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">何凯</a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="portfolio.html" class="nav-link">作品集</a>
                <a href="skills.html" class="nav-link active">技能</a>
                <a href="about.html" class="nav-link">关于我</a>
                <a href="contact.html" class="nav-link">联系我</a>
            </nav>
            <button class="nav-toggle" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <!-- 页面主体 -->
    <main class="page-content">
        <section class="section">
            <div class="container">
                <h2 class="section-title">专项能力</h2>
                <p class="section-subtitle">游戏特效相关技能栈</p>

                <!-- 引擎核心 -->
                <div class="skill-category">
                    <h3 class="skill-cat-title">引擎核心</h3>
                    <div class="skill-list">
                        <div class="skill-item">
                            <div class="skill-header">
                                <span class="skill-name">Unity</span>
                                <span class="skill-desc">粒子系统</span>
                                <span class="skill-pct">80%</span>
                            </div>
                            <div class="skill-bar"><div class="skill-fill" data-width="80"></div></div>
                        </div>
                        <div class="skill-item">
                            <div class="skill-header">
                                <span class="skill-name">Unreal Engine</span>
                                <span class="skill-desc">Niagara</span>
                                <span class="skill-pct">40%</span>
                            </div>
                            <div class="skill-bar"><div class="skill-fill" data-width="40"></div></div>
                        </div>
                    </div>
                </div>

                <!-- Shader/材质 -->
                <div class="skill-category">
                    <h3 class="skill-cat-title">Shader / 材质</h3>
                    <div class="skill-list">
                        <div class="skill-item">
                            <div class="skill-header">
                                <span class="skill-name">ASE</span>
                                <span class="skill-desc">溶解、菲涅尔等</span>
                                <span class="skill-pct">70%</span>
                            </div>
                            <div class="skill-bar"><div class="skill-fill" data-width="70"></div></div>
                        </div>
                        <div class="skill-item">
                            <div class="skill-header">
                                <span class="skill-name">UE 原生材质</span>
                                <span class="skill-desc">材质节点编辑</span>
                                <span class="skill-pct">30%</span>
                            </div>
                            <div class="skill-bar"><div class="skill-fill" data-width="30"></div></div>
                        </div>
                    </div>
                </div>

                <!-- 辅助三维软件 -->
                <div class="skill-category">
                    <h3 class="skill-cat-title">辅助三维软件</h3>
                    <div class="skill-list">
                        <div class="skill-item">
                            <div class="skill-header">
                                <span class="skill-name">3ds Max</span>
                                <span class="skill-desc">简易模型、面片制作等</span>
                                <span class="skill-pct">70%</span>
                            </div>
                            <div class="skill-bar"><div class="skill-fill" data-width="70"></div></div>
                        </div>
                        <div class="skill-item">
                            <div class="skill-header">
                                <span class="skill-name">Houdini</span>
                                <span class="skill-desc">基础入门</span>
                                <span class="skill-pct">20%</span>
                            </div>
                            <div class="skill-bar"><div class="skill-fill" data-width="20"></div></div>
                        </div>
                    </div>
                </div>

                <!-- 平面与后期 -->
                <div class="skill-category">
                    <h3 class="skill-cat-title">平面与后期</h3>
                    <div class="skill-list">
                        <div class="skill-item">
                            <div class="skill-header">
                                <span class="skill-name">Photoshop</span>
                                <span class="skill-desc">序列帧、特效贴图、调色、压缩优化</span>
                                <span class="skill-pct">80%</span>
                            </div>
                            <div class="skill-bar"><div class="skill-fill" data-width="80"></div></div>
                        </div>
                        <div class="skill-item">
                            <div class="skill-header">
                                <span class="skill-name">After Effects</span>
                                <span class="skill-desc">特效剪辑、视频合成、简易贴图</span>
                                <span class="skill-pct">60%</span>
                            </div>
                            <div class="skill-bar"><div class="skill-fill" data-width="60"></div></div>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2026 何凯. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
